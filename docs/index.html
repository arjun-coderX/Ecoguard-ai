const LAB_TYPES = {

    blurb: "A recent image; add an older one to measure habitat loss." },
};
const LAB_ORDER = ["wildfire", "deforestation", "urban", "habitat"];
const MAX_BYTES = 25 * 1024 * 1024, MAX_SIDE = 384;
const IMG_EXT = ["png", "jpg", "jpeg", "tif", "tiff"], REP_EXT = ["csv", "txt", "pdf"];
const extOf = n => ((n || "").split(".").pop() || "").toLowerCase();
const fmtBytes = b => (b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB");
const UNAV = "Unavailable";
const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100;

const LIBS = {};
function loadScript(src, globalName) {
  if (globalName && window[globalName]) return Promise.resolve();
  if (!LIBS[src]) LIBS[src] = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src; s.async = true;
    const fail = () => { clearTimeout(t); delete LIBS[src]; rej(new Error("Could not load " + src.split("/").pop() + ". Check your connection and try again.")); };
    const t = setTimeout(fail, 15000);
    s.onload = () => { clearTimeout(t); res(); }; s.onerror = fail;
    document.head.appendChild(s);
  });
  return LIBS[src];
}
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const GEOTIFF = "https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js";
const readAs = (file, how) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error || new Error("Could not read the file.")); fr[how](file); });
const tick = () => new Promise(r => setTimeout(r, 30));

/* ---------- rasters ---------- */
async function decodeRaster(file, target) {
  const ext = extOf(file.name);
  if (ext === "tif" || ext === "tiff") return decodeGeoTiff(file, target);
  const url = await readAs(file, "readAsDataURL");
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("This image could not be decoded. Use a PNG or JPG file.")); im.src = url; });
  const W0 = img.naturalWidth || img.width, H0 = img.naturalHeight || img.height;
  if (!W0 || !H0) throw new Error("The image has no pixels.");
  const k = Math.min(1, MAX_SIDE / Math.max(W0, H0));
  const w = target ? target.w : Math.max(1, Math.round(W0 * k)), h = target ? target.h : Math.max(1, Math.round(H0 * k));
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d"); ctx.drawImage(img, 0, 0, w, h);
  const rgba = ctx.getImageData(0, 0, w, h).data;
  return { rgba, w, h, nir: null, red: null, origW: W0, origH: H0, url: toURL(cv) || url, geo: null, bands: 3, format: ext === "jpg" ? "JPEG" : ext.toUpperCase(), fileDate: null };
}
async function decodeGeoTiff(file, target) {
  await loadScript(GEOTIFF, "GeoTIFF");
  if (!window.GeoTIFF) throw new Error("The GeoTIFF reader did not load.");
  const buf = await readAs(file, "readAsArrayBuffer");
  let tiff, image;
  try { tiff = await window.GeoTIFF.fromArrayBuffer(buf); image = await tiff.getImage(); }

  // 4 ---- alignment

  // 6 ---- evidence
  await step("evidence", async add => {

          if (type === "habitat" && ctx.dist && b === CLS.VEG && ctx.dist[i] <= ctx.thrPx) { val[i] = Math.max(val[i], .5); if (!col[i * 4 + 3]) paintPx(i, AMB, 120); }

/* ---------- recommendations & limitations ---------- */
function recommendations(type, ctx) {
  const hi = n => ctx.factors.some(f => f.name.startsWith(n) && f.score === 2);
  const out = [];
  if (ctx.result.level === "Insufficient Data") out.push("Add the missing inputs listed above and run the analysis again before acting on this result.");
  if (type === "wildfire") {
    if (hi("Minimum humidity") || hi("Wind speed")) out.push("Treat the flagged areas as priority patrol zones for the next 24–48 hours while dry, windy conditions last.");
    if (hi("Vegetation")) out.push("Check fuel load on the ground in the red zones; clear fire lines where they meet roads or homes.");
    if (ctx.factors.find(f => f.name === "Visible fire-coloured pixels" && f.value > .2)) out.push("Verify the fire-coloured pixels against VIIRS/MODIS active-fire data (NASA FIRMS) before responding.");
    out.push("Confirm with a thermal product and the official fire-danger bulletin for the area.");
  }
  if (type === "deforestation") { out.push("Visit or task high-resolution imagery for the hotspot cells to confirm clearing versus seasonal change."); if (hi("Forest patches")) out.push("Prioritise corridors between the remaining patches; fragmentation is accelerating."); out.push("Cross-check against permits and protected-area boundaries for the area."); }
  if (type === "urban") { out.push("Compare the new built-up cells against approved building permits and zoning maps."); if (hi("Vegetation lost")) out.push("Review drainage and flood capacity where vegetation was replaced by sealed surfaces."); }
  if (type === "habitat") { out.push("Use the flagged edge areas to site camera traps or field surveys; imagery alone cannot confirm wildlife use."); if (ctx.factors.some(f => f.name.startsWith("Habitat within") && f.score >= 1)) out.push("Consider buffers or wildlife crossings where habitat sits close to built-up land."); }
  return out;
}
function limitations(type, ctx) {
  const N = ctx.newer, out = [];
  if (!N.nir) out.push("RGB images only: vegetation is estimated with VARI (visible bands), which is less reliable than NDVI and cannot measure moisture.");
  out.push("No thermal or SWIR band, so active-fire heat and canopy moisture are not measured.");
  out.push("Land-cover classes come from colour rules; shadows, haze, crops and bright rooftops can be misclassified.");
  if (ctx.older && !(ctx.newer.geo && ctx.older.geo)) out.push("The two images are assumed to show the same footprint; small misalignments create false change along edges.");
  if (!ctx.pxGrid) out.push("Pixel size was not given, so areas and distances are in pixels rather than metres.");
  if (type === "habitat") out.push("Satellite imagery cannot show whether animals are present or moving; results describe habitat condition only.");
  out.push("This is a rule-based prototype. The thresholds are reasonable starting points, not a validated wildfire probability or deforestation model.");
  return out;

        {res.level === "Insufficient Data" && <p className="m-0 text-[14px] text-mist">Not enough of the required inputs were available. See the Evidence tab for what is missing.</p>}
        {note && <p className="m-0 text-[12.5px] text-fog" aria-live="polite">{note}</p>}
      </div>

      <div className="flex gap-1 border-b border-line" role="tablist" aria-label="Result details">
        {[["overview", "Map & actions"], ["evidence", "Evidence"], ["method", "Method & data"]].map(([k, l]) => (
          <button key={k} role="tab" aria-selected={tab === k} onClick={() => setTab(k)}
            className={`-mb-px min-h-[44px] border-b-2 px-4 text-[14px] transition ${tab === k ? "border-white text-white" : "border-transparent text-fog hover:text-white"}`}>{l}</button>
        ))}
      </div>

      {tab === "overview" && (
        <div className="grid items-start gap-8 lg:grid-cols-[1.25fr_1fr]">
          <ResultMap ctx={ctx} type={type} />
          <div className="grid content-start gap-6">
            <div className="grid gap-2"><h4 className="m-0 text-[15px] font-semibold text-white">What to do next</h4>
              {recommendations(type, ctx).map((t, i) => <p key={t} className="m-0 grid grid-cols-[22px_1fr] text-[14px] text-mist"><span className="font-mono text-[12px] text-emerald">{i + 1}</span>{t}</p>)}</div>
            <SafetyPlan type={type} level={res.level} />
            <div className="grid gap-1.5 rounded-md bg-char2 px-4 py-3 text-[12.5px] text-fog">
              <span className="font-mono text-[10.5px] uppercase tracking-[.12em]">How to read this</span>
              <span><b className="font-medium text-mist">Observed</b> values were measured from your files. <b className="font-medium text-mist">Estimated</b> risk comes from the rule set. No <b className="font-medium text-mist">forecast</b> is made.</span>
            </div>
          </div>
        </div>
      )}

      {tab === "evidence" && (
        <div className="grid gap-8 lg:grid-cols-[1.4fr_1fr]">
          <div className="grid content-start gap-2"><h4 className="m-0 text-[15px] font-semibold text-white">Scored factors</h4>
            <div className="overflow-x-auto"><table className="w-full border-collapse text-[13px]">
              <thead><tr className="text-left font-mono text-[10.5px] uppercase tracking-[.1em] text-fog"><th className="py-1.5 pr-3 font-normal">Factor</th><th className="py-1.5 pr-3 font-normal">Value</th><th className="py-1.5 pr-3 font-normal">Level</th><th className="py-1.5 font-normal">Rule</th></tr></thead>
              <tbody>{scored.map(f => (<tr key={f.name} className="border-t border-line align-top">
                <td className="py-2 pr-3 text-white">{f.name}<span className="block text-[11.5px] text-fog">{f.source || ""}{f.date ? ` · ${f.date}` : ""}</span></td>
                <td className="py-2 pr-3 font-mono text-white">{String(f.value)} <span className="text-fog">{f.unit}</span></td>
                <td className="py-2 pr-3"><span className="rounded px-1.5 py-0.5 text-[12px]" style={{ color: ["#34d6a4", "#ffb22e", "#ff4d5e"][f.score], background: ["#34d6a4", "#ffb22e", "#ff4d5e"][f.score] + "1a" }}>{LEVEL_NAME[f.score]}</span></td>
                <td className="py-2 text-[12px] text-fog">{f.rule}</td></tr>))}</tbody>
            </table></div>
          </div>
          <div className="grid content-start gap-6">
            {observed.length > 0 && <div className="grid gap-1.5"><h4 className="m-0 text-[15px] font-semibold text-white">Observed, not scored</h4>
              {observed.map(f => <p key={f.name} className="m-0 text-[13px] text-mist">{f.name} <span className="font-mono text-white">{String(f.value)} {f.unit}</span><span className="block text-[12px] text-fog">{f.rule}</span></p>)}</div>}
            {missing.length > 0 && <div className="grid gap-1.5"><h4 className="m-0 text-[15px] font-semibold text-white">Unavailable</h4>
              {missing.map(f => <p key={f.name} className="m-0 text-[13px] text-fog"><span className="text-mist">{f.name}</span> · {f.source}</p>)}</div>}
          </div>
        </div>
      )}

      {tab === "method" && (
        <div className="grid gap-8">
          <div className="grid gap-8 lg:grid-cols-2">
            <div className="grid content-start gap-2"><h4 className="m-0 text-[15px] font-semibold text-white">Why confidence is {ctx.confidence.level}</h4>
              {ctx.confidence.reasons.map(([ok, t]) => <p key={t} className="m-0 flex gap-2 text-[13px]" style={{ color: ok ? "#cddcd6" : "#7a908a" }}><Icon name={ok ? "Check" : "Minus"} size={14} className="mt-0.5 shrink-0" />{t}</p>)}</div>
            <div className="grid content-start gap-2"><h4 className="m-0 text-[15px] font-semibold text-white">Limitations</h4>
              {limitations(type, ctx).map(t => <p key={t} className="m-0 text-[13px] text-fog">· {t}</p>)}</div>
          </div>
          <div className="grid gap-2"><h4 className="m-0 text-[15px] font-semibold text-white">Data sources and method</h4>
            <div className="overflow-x-auto"><table className="w-full min-w-[620px] border-collapse text-[12.5px]">
              <thead><tr className="text-left font-mono text-[10.5px] uppercase tracking-[.1em] text-fog"><th className="py-1.5 pr-3 font-normal">Input</th><th className="py-1.5 pr-3 font-normal">File</th><th className="py-1.5 pr-3 font-normal">Acquired</th><th className="py-1.5 pr-3 font-normal">Resolution</th><th className="py-1.5 font-normal">Method</th></tr></thead>
              <tbody>
                {sources.map(([role, f, im, d]) => <tr key={role} className="border-t border-line"><td className="py-2 pr-3 text-white">{role}</td><td className="py-2 pr-3 text-mist">{f.name}</td><td className="py-2 pr-3 font-mono text-mist">{d || im.fileDate || UNAV}</td>
                  <td className="py-2 pr-3 font-mono text-mist">{im.origW}×{im.origH} px{ctx.pxGrid ? ` · ${r1(ctx.pxGrid * ctx.newer.w / ctx.newer.origW)} m` : ""}</td><td className="py-2 text-fog">{im.nir ? "NDVI from red + NIR" : "RGB colour rules + VARI"}, analysed at {ctx.newer.w}×{ctx.newer.h}</td></tr>)}
                {files.reports.map(f => <tr key={f.name} className="border-t border-line"><td className="py-2 pr-3 text-white">Report</td><td className="py-2 pr-3 text-mist">{f.name}</td><td className="py-2 pr-3 font-mono text-mist">{meta.dateReport || "see values"}</td><td className="py-2 pr-3 text-mist">—</td>
                  <td className="py-2 text-fog">{/\.csv$/i.test(f.name) ? "CSV columns, last 7 rows" : /\.pdf$/i.test(f.name) ? "pdf.js text + pattern extraction" : "pattern extraction (English / Hindi)"}</td></tr>)}
                <tr className="border-t border-line"><td className="py-2 pr-3 text-white">Assessment</td><td className="py-2 pr-3 text-mist" colSpan="3">Transparent rule set (thresholds in the Evidence tab)</td><td className="py-2 text-fog">Mean of 0–2 factor scores → Low / Moderate / High</td></tr>
              </tbody>
            </table></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- the lab ---------- */
function Lab() {
  const [type, setType] = useState("wildfire");
  const [stage, setStage] = useState(0);           // 0 choose · 1 data · 2 details
  const [files, setFiles] = useState({ newer: null, older: null, reports: [] });
  const [errs, setErrs] = useState({ newer: [], older: [], reports: [] });
  const [meta, setMeta] = useState({ location: "", lat: "", lon: "", dateOld: "", dateNew: "", dateReport: "", pixelM: "" });
  const [auto, setAuto] = useState({});
  const [pasted, setPasted] = useState(""), [showPaste, setShowPaste] = useState(false), [showOld, setShowOld] = useState(false), [showLoc, setShowLoc] = useState(false);
  const [steps, setSteps] = useState({});
  const [state, setState] = useState("idle");
  const [ctx, setCtx] = useState(null), [fail, setFail] = useState("");
  const [busy, setBusy] = useState(false);
  const T = LAB_TYPES[type], tone = TYPE_TONE[type];
  const setM = k => v => setMeta(m => ({ ...m, [k]: v }));
  const wantOld = T.old !== "optional" || showOld || !!files.older;
  const wantRep = T.report === "recommended" || files.reports.length > 0 || showPaste;

  const addFiles = (slot, list) => {
    const allowed = slot === "reports" ? REP_EXT : IMG_EXT, e = [];
    const ok = list.filter(f => { const x = extOf(f.name);
      if (!allowed.includes(x)) { e.push(`${f.name}: ${x ? "." + x : "this type"} isn't supported. Use ${allowed.map(a => a.toUpperCase()).join(", ")}.`); return false; }
      if (f.size > MAX_BYTES) { e.push(`${f.name} is larger than 25 MB.`); return false; }
      if (!f.size) { e.push(`${f.name} is empty.`); return false; } return true; });
    setErrs(s => ({ ...s, [slot]: e }));
    if (!ok.length) return;
    setFiles(fs => slot === "reports" ? { ...fs, reports: [...fs.reports, ...ok].slice(0, 3) } : { ...fs, [slot]: ok[0] });
    if (slot !== "reports" && /\.tiff?$/i.test(ok[0].name)) {
      decodeGeoTiff(ok[0]).then(im => {
        const g = im.geo, upd = {}, a = {};
        if (g && g.geographic) { upd.lat = String(+g.lat.toFixed(5)); upd.lon = String(+g.lon.toFixed(5)); a.lat = a.lon = true; }
        if (g && g.pixelM) { upd.pixelM = String(r2(g.pixelM)); a.pixelM = true; }
        const dk = slot === "older" ? "dateOld" : "dateNew"; if (im.fileDate) { upd[dk] = im.fileDate; a[dk] = true; }
        setMeta(m => ({ ...m, ...Object.fromEntries(Object.entries(upd).filter(([k]) => m[k] === "")) })); setAuto(x => ({ ...x, ...a }));
      }).catch(err => setErrs(s => ({ ...s, [slot]: [err.message] })));
    }
  };
  const remove = (slot, i) => { setFiles(fs => slot === "reports" ? { ...fs, reports: fs.reports.filter((_, k) => k !== i) } : { ...fs, [slot]: null }); setErrs(s => ({ ...s, [slot]: [] })); };
  const missingReq = !files.newer || (T.old === "required" && !files.older);

  async function loadSample(runAfter) {
    setBusy(true);
    try {
      const s = await sampleInputs(type); setFiles(s.files); setMeta(s.meta); setAuto({}); setPasted(""); setErrs({ newer: [], older: [], reports: [] });
      setShowOld(!!s.files.older); setShowLoc(true); setStage(2); setState("idle"); setCtx(null);
      if (runAfter) setTimeout(() => analyse(s.files, s.meta, ""), 50);
    } finally { setBusy(false); }
  }
  async function analyse(f = files, m = meta, p = pasted) {
    setState("running"); setCtx(null); setFail(""); setSteps({});
    setTimeout(() => { const el = document.getElementById("lab-run"); el && el.scrollIntoView && el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 30);
    try {
      const c = await runPipeline({ type, files: f, meta: m, pasted: p }, (id, st) => setSteps(s => ({ ...s, [id]: st })));
      setCtx(c); setState("done");
    } catch (e) { setState("failed"); setFail(e.message === "stopped" ? "Stopped at a failed check. The red step below shows what to fix." : "Something went wrong: " + e.message); }
  }
  const doneSteps = STEP_DEFS.filter(([id]) => steps[id] && steps[id].status !== "running").length;
  const ready = [
    ["Newer image", !!files.newer, true],
    ...(T.old !== "optional" || files.older ? [["Older image", !!files.older, T.old === "required"]] : []),
    ...(T.report === "recommended" ? [["Weather report", files.reports.length > 0 || !!pasted.trim(), false]] : []),
    ["Image dates", !!meta.dateNew && (!files.older || !!meta.dateOld), false],
    ["Pixel size", meta.pixelM !== "", false],
    ["Location", meta.lat !== "" && meta.lon !== "", false],
  ];
  const STAGES = ["Choose", "Add data", "Details"];

  return (
    <section id="lab" className="relative scroll-mt-14 border-t border-line bg-char px-4 pb-28 pt-20 sm:px-6">
      <div className="mx-auto grid max-w-6xl gap-10">
        <header className="flex flex-wrap items-end justify-between gap-6">
          <div className="grid max-w-2xl gap-3">
            <span className="font-mono text-[12px] tracking-[.26em] text-cyan">06 · ENVIRONMENTAL RISK LAB</span>
            <h2 className="m-0 font-display text-[clamp(2rem,4.6vw,3.4rem)] font-semibold leading-[1] text-white">Analyse your own area.</h2>
            <p className="m-0 text-[15px] text-mist">Three quick steps. Everything runs in your browser and nothing is uploaded.</p>
          </div>
          <button onClick={() => loadSample(true)} disabled={busy || state === "running"} className="inline-flex min-h-[46px] items-center gap-2 rounded-md bg-white px-5 text-[14px] font-semibold text-char transition hover:bg-mist disabled:opacity-50">
            <Icon name="Zap" size={16} />Try a sample in one click
          </button>
        </header>

        <div className="grid items-start gap-6 lg:grid-cols-[1fr_300px]">
          {/* ---- wizard ---- */}
          <div className="grid gap-6 rounded-lg bg-char2 p-5 sm:p-6">
            <ol className="m-0 flex list-none gap-1 p-0" aria-label="Steps">
              {STAGES.map((s, i) => (
                <li key={s} className="flex-1">
                  <button onClick={() => setStage(i)} aria-current={stage === i ? "step" : undefined} className="grid w-full gap-1.5 text-left">
                    <span className="h-1 rounded-full transition" style={{ background: i <= stage ? tone : "#24342f" }} />
                    <span className={`text-[12.5px] ${stage === i ? "text-white" : "text-fog"}`}><span className="font-mono">{i + 1}</span> · {s}</span>
                  </button>
                </li>
              ))}
            </ol>

            {stage === 0 && (
              <div className="grid gap-3">
                <h3 className="m-0 text-[17px] font-semibold text-white">What do you want to check?</h3>
                <div className="grid gap-2 sm:grid-cols-2" role="radiogroup" aria-label="Analysis type">
                  {LAB_ORDER.map(k => { const L = LAB_TYPES[k], on = type === k, c = TYPE_TONE[k]; return (
                    <button key={k} role="radio" aria-checked={on} onClick={() => { setType(k); setState("idle"); setCtx(null); }}
                      className="flex min-h-[72px] items-center gap-3 rounded-md px-3 py-3 text-left transition"
                      style={{ background: on ? `${c}14` : "#0b1210", boxShadow: on ? `inset 0 0 0 1.5px ${c}` : "inset 0 0 0 1px #20302b" }}>
                      <span className="grid h-10 w-10 shrink-0 place-items-center rounded-md" style={{ background: `${c}1f`, color: c }}><Icon name={L.icon} size={19} /></span>
                      <span className="grid gap-0.5"><span className="text-[14.5px] font-medium text-white">{L.label}</span><span className="text-[12px] text-fog">{L.blurb}</span></span>
                    </button>); })}
                </div>
              </div>
            )}

            {stage === 1 && (
              <div className="grid gap-5">
                <h3 className="m-0 text-[17px] font-semibold text-white">Add your files</h3>
                <div className={`grid gap-5 ${wantOld ? "md:grid-cols-2" : ""}`}>
                  {wantOld && <Slot id="up-old" title="Older image" need={T.old} tone={SLOT_TONE.older} accept=".png,.jpg,.jpeg,.tif,.tiff" files={[files.older]} errors={errs.older}
                    onAdd={l => addFiles("older", l)} onRemove={() => remove("older")} hint="Same area, earlier date" />}
                  <Slot id="up-new" title={wantOld ? "Newer image" : "Satellite image"} need="required" tone={SLOT_TONE.newer} accept=".png,.jpg,.jpeg,.tif,.tiff" files={[files.newer]} errors={errs.newer}
                    onAdd={l => addFiles("newer", l)} onRemove={() => remove("newer")} hint="PNG, JPG or GeoTIFF · max 25 MB" />
                </div>
                {wantRep ? (
                  <div className="grid gap-3">
                    <Slot id="up-rep" title="Weather report" need={T.report} tone={SLOT_TONE.reports} accept=".csv,.txt,.pdf" multiple files={files.reports} errors={errs.reports}
                      onAdd={l => addFiles("reports", l)} onRemove={i => remove("reports", i)} hint="CSV, TXT or PDF · up to 3" />
                    {showPaste || pasted ? (
                      <label htmlFor="paste" className="grid gap-1.5"><span className="text-[12.5px] text-fog">Or paste the report text</span>
                        <textarea id="paste" value={pasted} onChange={e => setPasted(e.target.value)} placeholder="Max temperature 37°C. Humidity 18%. Winds NW 25 km/h. No rain for 12 days."
                          className="min-h-[84px] rounded-md border border-line bg-char px-3 py-2 text-[13.5px] text-white placeholder:text-[#566a64] focus:border-amber focus:outline-none" /></label>
                    ) : <button className="justify-self-start text-[13px] text-amber underline-offset-4 hover:underline" onClick={() => setShowPaste(true)}>Paste text instead</button>}
                  </div>
                ) : null}
                <div className="flex flex-wrap gap-x-5 gap-y-2 text-[13px]">
                  {!wantOld && <button className="text-mist underline-offset-4 hover:text-white hover:underline" onClick={() => setShowOld(true)}>+ Add an older image to compare</button>}
                  {!wantRep && <button className="text-mist underline-offset-4 hover:text-white hover:underline" onClick={() => setShowPaste(true)}>+ Add a weather report (optional)</button>}
                </div>
              </div>
            )}

            {stage === 2 && (
              <div className="grid gap-5">
                <h3 className="m-0 text-[17px] font-semibold text-white">A few details</h3>
                <div className={`grid gap-4 ${files.older ? "sm:grid-cols-2" : "sm:grid-cols-2"}`}>
                  {files.older && <Field id="m-dold" type="date" label="Older image date" value={meta.dateOld} onChange={setM("dateOld")} auto={auto.dateOld} />}
                  <Field id="m-dnew" type="date" label={files.older ? "Newer image date" : "Image date"} value={meta.dateNew} onChange={setM("dateNew")} auto={auto.dateNew} />
                  {(files.reports.length > 0 || pasted.trim()) && <Field id="m-drep" type="date" label="Report date" value={meta.dateReport} onChange={setM("dateReport")} hint="If the file doesn't say" />}
                </div>
                <div className="grid gap-2">
                  <span className="flex items-baseline justify-between gap-2 text-[12.5px] text-fog">Where is the image from? <span className="text-[11.5px] text-[#6e8580]">sets pixel size for area estimates{auto.pixelM ? " · read from file" : ""}</span></span>
                  <div className="flex flex-wrap gap-2" role="radiogroup" aria-label="Pixel size">
                    {PX_PRESETS.map(([l, v]) => { const on = meta.pixelM === v; return (
                      <button key={l} role="radio" aria-checked={on} onClick={() => setM("pixelM")(v)} className="min-h-[38px] rounded-full px-3.5 text-[13px] transition"
                        style={{ background: on ? "#e9f2ee" : "#0b1210", color: on ? "#0b1210" : "#cddcd6", boxShadow: on ? "none" : "inset 0 0 0 1px #20302b" }}>{l}{v && <span className="ml-1 font-mono text-[11px] opacity-70">{v} m</span>}</button>); })}
                    <input id="m-px" aria-label="Custom pixel size in metres" value={PX_PRESETS.some(([, v]) => v === meta.pixelM) ? "" : meta.pixelM} onChange={e => setM("pixelM")(e.target.value)} placeholder="custom m"
                      className="min-h-[38px] w-28 rounded-full border border-line bg-char px-3.5 text-[13px] text-white placeholder:text-[#566a64] focus:border-cyan focus:outline-none" />
                  </div>
                </div>
                {showLoc || meta.lat || meta.lon ? (
                  <div className="grid gap-4 sm:grid-cols-3">
                    <Field id="m-loc" label="Place name" value={meta.location} onChange={setM("location")} placeholder="Mussoorie range" />
                    <Field id="m-lat" label="Latitude" value={meta.lat} onChange={setM("lat")} placeholder="30.35" auto={auto.lat} />
                    <Field id="m-lon" label="Longitude" value={meta.lon} onChange={setM("lon")} placeholder="78.05" auto={auto.lon} />
                  </div>
                ) : <button className="justify-self-start text-[13px] text-mist underline-offset-4 hover:text-white hover:underline" onClick={() => setShowLoc(true)}>+ Add location (gives hotspot coordinates)</button>}
              </div>
            )}

            <div className="flex items-center justify-between gap-3 border-t border-line pt-4">
              <button onClick={() => setStage(Math.max(0, stage - 1))} disabled={stage === 0} className="min-h-[40px] rounded-md px-3 text-[13.5px] text-mist transition hover:text-white disabled:invisible">← Back</button>
              {stage < 2
                ? <button onClick={() => setStage(stage + 1)} className="inline-flex min-h-[42px] items-center gap-2 rounded-md px-4 text-[14px] font-semibold text-char transition hover:brightness-110" style={{ background: tone }}>Next<Icon name="ArrowRight" size={16} /></button>
                : <button onClick={() => analyse()} disabled={missingReq || state === "running"} className="inline-flex min-h-[42px] items-center gap-2 rounded-md bg-emerald px-4 text-[14px] font-semibold text-char transition hover:brightness-110 disabled:opacity-40">Run analysis<Icon name="Play" size={15} /></button>}
            </div>
          </div>

          {/* ---- readiness ---- */}
          <aside className="grid gap-4 rounded-lg p-5 lg:sticky lg:top-20" style={{ boxShadow: "inset 0 0 0 1px #20302b" }} aria-label="Readiness">
            <div className="flex items-center gap-3">
              <span className="grid h-9 w-9 place-items-center rounded-md" style={{ background: `${tone}1f`, color: tone }}><Icon name={T.icon} size={17} /></span>
              <span className="grid"><span className="text-[14px] font-medium text-white">{T.label}</span><button className="justify-self-start text-[12px] text-fog hover:text-white" onClick={() => setStage(0)}>change</button></span>
            </div>
            <ul className="m-0 grid list-none gap-2 p-0">
              {ready.map(([l, ok, req]) => (
                <li key={l} className="flex items-center gap-2.5 text-[13.5px]">
                  <span className="grid h-5 w-5 place-items-center rounded-full" style={{ background: ok ? "#34d6a4" : "transparent", boxShadow: ok ? "none" : `inset 0 0 0 1.5px ${req ? "#ff7a2e" : "#33453f"}`, color: "#0b1210" }}>{ok && <Icon name="Check" size={12} />}</span>
                  <span className={ok ? "text-white" : "text-fog"}>{l}</span>
                  <span className="ml-auto font-mono text-[10.5px] uppercase tracking-[.1em]" style={{ color: req && !ok ? "#ff7a2e" : "#6e8580" }}>{req ? "required" : "improves"}</span>
                </li>
              ))}
            </ul>
            <button onClick={() => analyse()} disabled={missingReq || state === "running"} className="inline-flex min-h-[46px] items-center justify-center gap-2 rounded-md bg-emerald text-[14.5px] font-semibold text-char transition hover:brightness-110 disabled:opacity-40">
              <Icon name={state === "running" ? "Loader" : "Play"} size={16} className={state === "running" ? "animate-spin" : ""} />{state === "running" ? `Step ${Math.min(6, doneSteps + 1)} of 6` : "Run analysis"}
            </button>
            <p className="m-0 text-[12px] text-fog" aria-live="polite">{missingReq ? `Needs ${!files.newer ? "a satellite image" : "an older image"} first.` : "Ready. Optional items raise confidence."}</p>
            <button onClick={() => loadSample(false)} disabled={busy || state === "running"} className="justify-self-start text-[12.5px] text-cyan underline-offset-4 hover:underline disabled:opacity-50">Fill with sample data</button>
          </aside>
        </div>

        {state !== "idle" && (
          <div id="lab-run" className="grid scroll-mt-20 gap-3 rounded-lg bg-char2 p-5 sm:p-6">
            <div className="flex flex-wrap items-baseline justify-between gap-2">
              <h3 className="m-0 text-[17px] font-semibold text-white">Processing</h3>
              <span className="font-mono text-[12px] text-fog">{doneSteps} / 6 steps · tap a step for every value checked</span>
            </div>
            <div className="h-1 overflow-hidden rounded-full bg-line"><div className="h-full transition-all" style={{ width: `${doneSteps / 6 * 100}%`, background: state === "failed" ? "#ff4d5e" : "#4cc3e8" }} /></div>
            <ol className="m-0 list-none p-0">{STEP_DEFS.map((d, i) => <StepRow key={d[0]} def={d} st={steps[d[0]]} idx={i} />)}</ol>
            {state === "failed" && <p className="m-0 rounded-md bg-crimson/10 px-4 py-3 text-[14px] text-[#ffb1bb]" role="alert">{fail}</p>}
          </div>
        )}
        {state === "done" && ctx && <Results ctx={ctx} type={type} meta={meta} files={files} />}
      </div>
    </section>
  );
}

/* ===================== page ===================== */
function App() {
  const journeyRef = useRef(null), p = useScrollProgress(journeyRef);
  const [safety, setSafety] = useState({ open: false, start: "prevent" });
  const openSafety = (start = "prevent") => setSafety({ open: true, start });
  const inJourney = p > 0 && p < 1;
  function jump(target) {
    const el = journeyRef.current; if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY, span = el.offsetHeight - window.innerHeight;
    window.scrollTo({ top: top + target * span, behavior: "smooth" });
  }
  return (
    <SafetyCtx.Provider value={openSafety}>
    <div className="grain min-h-full bg-char font-sans text-[15px] leading-relaxed">
      <nav className="fixed inset-x-0 z-40 border-b border-white/5 bg-char/70 backdrop-blur-md" style={{ top: "env(safe-area-inset-top, 0px)" }} aria-label="Chapters">
        <div className="mx-auto flex max-w-7xl items-center gap-3 px-4 py-2 sm:px-6">
          <a href="#" onClick={e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); }} className="mr-auto shrink-0" aria-label="EcoGuard AI, back to top"><Wordmark size={30} /></a>
          <div className="flex min-w-0 gap-1 overflow-x-auto">
            <button onClick={() => jump(0)} aria-current={inJourney ? "step" : undefined} className={`min-h-[36px] shrink-0 rounded-full px-3 font-mono text-[11px] uppercase tracking-[.14em] transition ${inJourney ? "bg-white/10 text-white" : "text-fog hover:text-white"}`}>Story</button>
            {[["#about", "About"], ["#findings", "Results"], ["#build", "Journey"], ["#emergency", "Emergency"], ["#contact", "Contact"]].map(([h, l]) => (
              <a key={h} href={h} className="grid min-h-[36px] shrink-0 place-items-center rounded-full px-3 font-mono text-[11px] uppercase tracking-[.14em] text-fog hover:text-white">{l}</a>
            ))}
            <button onClick={() => openSafety("prevent")} className="flex min-h-[36px] shrink-0 items-center gap-1.5 rounded-full px-3 font-mono text-[11px] uppercase tracking-[.14em] text-amber hover:text-white"><Icon name="ShieldCheck" size={14} />Safety</button>
            <a href="#lab" className="grid min-h-[36px] shrink-0 place-items-center rounded-full bg-emerald/15 px-3 font-mono text-[11px] uppercase tracking-[.14em] text-emerald hover:text-white">Risk Lab</a>
          </div>
        </div>
        <div className="h-0.5 bg-white/5"><div className="h-full bg-ember" style={{ width: `${p * 100}%` }} /></div>
      </nav>
      <Journey sectionRef={journeyRef} p={p} />
      <About />
      <Findings />
      <Lab />
      <BuildJourney />
      <WhoToCall />
      <Contact />
      {!safety.open && p > .06 && (
        <button onClick={() => openSafety("prevent")} className="fixed bottom-4 right-4 z-40 inline-flex min-h-[46px] items-center gap-2 rounded-full bg-amber px-4 text-[13.5px] font-semibold text-char shadow-lg shadow-black/40 transition hover:brightness-110 sm:bottom-6 sm:right-6">
          <Icon name="ShieldCheck" size={17} /><span className="hidden sm:inline">How to prevent wildfires</span><span className="sm:hidden">Safety guide</span>
        </button>
      )}
      <SafetyGuide open={safety.open} start={safety.start} onClose={() => setSafety(s => ({ ...s, open: false }))} />
      <footer className="border-t border-line bg-char px-4 py-10 sm:px-6">
        <div className="mx-auto flex max-w-6xl flex-wrap items-start justify-between gap-x-10 gap-y-3 text-[13px] text-fog">
          <div className="w-full pb-3"><Wordmark size={34} sub /></div>
          <p className="m-0 max-w-xl">Made by Arjun Ray, October 2026 · <a className="text-mist hover:text-white" href={`mailto:${EMAIL}`}>{EMAIL}</a>. The story scenes and sample files are illustrations; nothing on this page is a live forecast.</p>
          <p className="m-0"><a className="text-mist hover:text-white" href="model.html">Full model dashboard</a> · method and limits in the README</p>
        </div>
      </footer>
    </div>
    </SafetyCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
